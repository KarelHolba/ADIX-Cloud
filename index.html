<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ADIX Cloud | Tři pilíře. Jedna vize.</title>

    <meta name="description"
          content="ADIX Cloud – 365 Solutions, Managed ICT a Dev & Services. Tři pilíře. Jedna vize.">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #031426;
        }

        body {
            overflow: hidden;
        }

        .hero {
            position: fixed;
            inset: 0;

            background-image:
                url("images/adixcloud-three-pillars.png");

            background-position: center center;
            background-repeat: no-repeat;
            background-size: contain;

            /* omezení běžného označování */
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* průhledná vrstva nad grafikou */
        .protect {
            position: absolute;
            inset: 0;
            z-index: 10;
        }
    </style>
</head>

<body>

    <main class="hero"
          role="img"
          aria-label="ADIX Cloud – Three Pillars of Your Digital Future">

        <div class="protect"
             aria-hidden="true"></div>

    </main>

    <script>
        // Zakázání kontextového menu
        document.addEventListener("contextmenu", function (event) {
            event.preventDefault();
        });

        // Zakázání přetahování
        document.addEventListener("dragstart", function (event) {
            event.preventDefault();
        });
    </script>

</body>
</html>
